services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: laravel-mcp-app
    container_name: laravel-app
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "8000:8000"
      - "5173:5173"
    volumes:
      - .:/var/www/html:cached
      - /var/www/html/vendor
      - /var/www/html/node_modules
      - /var/www/html/storage
    networks:
      - web

  queue:
    profiles: ["workers"]
    image: laravel-mcp-app
    container_name: laravel-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --verbose --tries=3 --timeout=90
    volumes:
      - .:/var/www/html:cached
      - /var/www/html/vendor
      - /var/www/html/node_modules
      - /var/www/html/storage
    networks:
      - web
    depends_on:
      - app

  scheduler:
    profiles: ["workers"]
    image: laravel-mcp-app
    container_name: laravel-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html:cached
      - /var/www/html/vendor
      - /var/www/html/node_modules
      - /var/www/html/storage
    networks:
      - web
    depends_on:
      - app

networks:
  web:
    external: true
    name: web
